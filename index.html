<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HomeControl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --border-subtle: rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #dbeafe 0%, #f8fafc 42%, #ecfeff 100%);
      color: #0f172a;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .hc-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
    }
    @keyframes chatPulseLight {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65), inset 0 0 0 2px rgba(245, 158, 11, 0.95);
        background-color: #fef3c7;
      }
      50% {
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0), inset 0 0 0 2px rgba(217, 119, 6, 1);
        background-color: #fde68a;
      }
    }
    .chat-alert-blink {
      animation: chatPulseLight 0.85s ease-in-out infinite;
    }
    .tablet-force .split-pane {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      align-items: start;
    }
    @media (min-width: 768px) and (orientation: landscape) {
      .split-pane {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 0.9rem;
        align-items: start;
      }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="select-none">
  <div id="app" class="h-dvh flex flex-col max-w-md mx-auto transition-all duration-200 overflow-hidden"></div>

  <!-- Modal genérico -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/45 backdrop-blur-xs p-3">
    <div id="modal-box" class="hc-card w-full max-w-sm rounded-3xl p-4 text-slate-900"></div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURACIÓN FIREBASE RTDB + RESPALDO LOCAL
    // =========================================================================
    const FIREBASE_DB_URL = "https://hogarcontrol-65d91-default-rtdb.europe-west1.firebasedatabase.app";

    const DEFAULT_HOME_DATA = () => ({
      meta: {
        createdAt: Date.now(),
        masterPasswordHash: null,
        ownerNames: [],
        updatedAt: Date.now()
      },
      employees: {},
      shifts: {},
      tasks: {},
      chats: {},
      closures: {}
    });

    // =========================================================================
    // ESTADO DE SESIÓN Y UI
    // =========================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const initialCode = (urlParams.get("hogar") || localStorage.getItem("hc_last_home") || "").trim().toUpperCase();
    const savedOwnerName = (localStorage.getItem("hc_owner_name") || "").trim();

    const state = {
      homeCode: initialCode,
      role: null,              // 'owner' | 'employee' | null
      loginPanel: null,        // null | 'owner' | 'employee'
      isMaster: false,
      ownerName: savedOwnerName,
      activeEmpId: null,
      ownerSubTab: "shifts",   // 'shifts' | 'tasks' | 'chat' | 'employees' | 'closures'
      ownerChatEmpId: null,
      empTab: "work",          // 'work' | 'calendar' | 'chat'
      calMonth: currentYearMonth(),
      ownerCalEmpId: null,
      ownerCalMonth: currentYearMonth(),
      tabletMode: localStorage.getItem("hc_tablet_mode") === "1",
      soundMuted: localStorage.getItem("hc_sound_muted") === "1",
      unreadChat: {},
      blinkingChat: {},
      data: DEFAULT_HOME_DATA(),
      syncStatus: "local",
      pollTimer: null,
      clockTimer: null,
      audioCtx: null,
      isBusyAction: false
    };

    // =========================================================================
    // UTILIDADES DE FECHA, MES CORTO (NOV 2026) Y CÁLCULO (MÁX. 1 DECIMAL)
    // =========================================================================
    const SHORT_MONTHS = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

    function pad2(n) { return String(n).padStart(2, "0"); }

    function toDateStr(tsOrDate) {
      const d = tsOrDate instanceof Date ? tsOrDate : new Date(tsOrDate);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function currentYearMonth() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    }

    function shiftMonthKey(monthKey, deltaMonths) {
      const [yStr, mStr] = (monthKey || currentYearMonth()).split("-");
      const d = new Date(Number(yStr), Number(mStr) - 1 + deltaMonths, 1);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    }

    function formatShortMonthYear(monthKey) {
      const [yStr, mStr] = (monthKey || currentYearMonth()).split("-");
      const idx = Math.max(0, Math.min(11, (Number(mStr) || 1) - 1));
      const year = Number(yStr) || new Date().getFullYear();
      return `${SHORT_MONTHS[idx]} ${year}`;
    }

    function getMonthOptions(activeMonth) {
      const base = currentYearMonth();
      const set = new Set();
      for (let i = -12; i <= 3; i++) {
        set.add(shiftMonthKey(base, i));
      }
      if (activeMonth) set.add(activeMonth);
      return Array.from(set).sort();
    }

    function formatTimeHM(ts) {
      if (!ts || Number.isNaN(Number(ts))) return formatTimeHM(Date.now());
      const d = new Date(Number(ts));
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function formatDateShort(dateStr) {
      const parts = String(dateStr || "").split("-");
      if (parts.length !== 3) return toDateStr(Date.now()).slice(5).split("-").reverse().join("/");
      return `${parts[2]}/${parts[1]}`;
    }

    function msToHoursMinutes(ms) {
      const safeMs = Math.max(0, Number(ms) || 0);
      const totalMinutes = Math.floor(safeMs / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return { hours, minutes, totalMinutes, text: `${hours}h ${pad2(minutes)}m` };
    }

    function oneDecimalNumber(amount) {
      const val = Number(amount) || 0;
      return Math.round(val * 10) / 10;
    }

    function formatOneDecimalEuro(amount) {
      const rounded = oneDecimalNumber(amount);
      if (Number.isInteger(rounded)) return `${rounded} €`;
      return `${rounded.toFixed(1).replace(".", ",")} €`;
    }

    function getCurrentOwnerLabel() {
      const clean = (state.ownerName || "").trim();
      if (clean) return clean;
      return state.isMaster ? "Propietario 1" : "Propietario";
    }

    function registerOwnerName(name) {
      const clean = (name || "").trim();
      if (!clean) return;
      state.ownerName = clean;
      localStorage.setItem("hc_owner_name", clean);
      state.data.meta = state.data.meta || {};
      const list = Array.isArray(state.data.meta.ownerNames) ? [...state.data.meta.ownerNames] : [];
      if (!list.some((n) => n.toLowerCase() === clean.toLowerCase())) {
        list.push(clean);
      }
      state.data.meta.ownerNames = list;
    }

    function getRateForDate(emp, dateStr) {
      if (!emp || !Array.isArray(emp.rateHistory) || emp.rateHistory.length === 0) return 10;
      const sorted = [...emp.rateHistory].sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate));
      let activeRate = sorted[0].rate;
      for (const item of sorted) {
        if (item.effectiveDate <= dateStr) {
          activeRate = Number(item.rate);
        }
      }
      return activeRate;
    }

    function getShiftDurationMs(shift, nowTs = Date.now()) {
      if (!shift || !shift.startTs) return 0;
      const end = shift.endTs || (shift.status === "open" ? nowTs : shift.startTs);
      return Math.max(0, end - shift.startTs);
    }

    function isShiftExcessUnreviewed(shift) {
      if (!shift || !shift.endTs || shift.status === "confirmed" || shift.excessReviewed) return false;
      const emp = state.data.employees[shift.empId];
      if (!emp) return false;
      const mins = Math.floor((shift.endTs - shift.startTs) / 60000);
      return mins > (Number(emp.dailyHours) || 8) * 60 + 60;
    }

    function getMonthSummary(empId, monthKey) {
      const emp = state.data.employees[empId];
      const shifts = Object.values(state.data.shifts || {}).filter(
        (s) => s.empId === empId && s.date.startsWith(monthKey)
      );
      const daysSet = new Set();
      let confirmedMs = 0;
      let pendingMs = 0;
      let openMs = 0;
      let confirmedAmount = 0;

      for (const s of shifts) {
        daysSet.add(s.date);
        if (s.status === "confirmed") {
          const ms = getShiftDurationMs(s, s.endTs || s.startTs);
          confirmedMs += ms;
          confirmedAmount += (ms / 3600000) * getRateForDate(emp, s.date);
        } else if (s.status === "pending") {
          pendingMs += getShiftDurationMs(s, s.endTs || s.startTs);
        } else if (s.status === "open") {
          openMs += getShiftDurationMs(s, Date.now());
        }
      }

      return {
        daysCount: daysSet.size,
        confirmedMs,
        pendingMs,
        openMs,
        confirmedAmount,
        closure: state.data.closures[`${empId}_${monthKey}`] || null
      };
    }

    function getDayStatusSummary(empId, dateStr) {
      const dayShifts = Object.values(state.data.shifts || {}).filter(
        (s) => s.empId === empId && s.date === dateStr
      );
      if (dayShifts.length === 0) return { state: "none", totalMs: 0, shifts: [] };
      const hasOpen = dayShifts.some((s) => s.status === "open");
      const hasPending = dayShifts.some((s) => s.status === "pending");
      const allConfirmed = dayShifts.every((s) => s.status === "confirmed");

      let totalMs = 0;
      for (const s of dayShifts) {
        if (s.status === "confirmed" || s.status === "pending") {
          totalMs += getShiftDurationMs(s, s.endTs || s.startTs);
        } else if (s.status === "open") {
          totalMs += getShiftDurationMs(s, Date.now());
        }
      }

      let visualState = "mixed";
      if (hasOpen) visualState = "open";
      else if (hasPending) visualState = "pending";
      else if (allConfirmed) visualState = "confirmed";

      return { state: visualState, totalMs, shifts: dayShifts };
    }

    // =========================================================================
    // SONIDO "PIPIP... PIPIP... PIPIP" POR WEB AUDIO API
    // =========================================================================
    let soundIntervalId = null;

    function playPipPipBurst() {
      if (state.soundMuted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!state.audioCtx) state.audioCtx = new AudioCtx();
        if (state.audioCtx.state === "suspended") {
          state.audioCtx.resume().catch(() => {});
        }
        const ctx = state.audioCtx;
        const now = ctx.currentTime;
        const pulses = [0, 0.14, 0.45, 0.59, 0.9, 1.04];
        pulses.forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(980, now + offset);
          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.14, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.095);
        });
      } catch (_) {}
    }

    function triggerChatPipPipAlarm(empId) {
      state.unreadChat[empId] = true;
      state.blinkingChat[empId] = true;
      playPipPipBurst();
      if (soundIntervalId) clearInterval(soundIntervalId);
      let ticks = 0;
      soundIntervalId = setInterval(() => {
        ticks += 1;
        if (ticks >= 3 || state.soundMuted) {
          clearInterval(soundIntervalId);
          soundIntervalId = null;
          return;
        }
        playPipPipBurst();
      }, 1450);
    }

    function stopChatAlarmFor(empId) {
      state.unreadChat[empId] = false;
      state.blinkingChat[empId] = false;
      if (soundIntervalId) {
        clearInterval(soundIntervalId);
        soundIntervalId = null;
      }
    }

    // =========================================================================
    // PERSISTENCIA: LOCALSTORAGE + FIREBASE REALTIME DATABASE
    // =========================================================================
    function localStorageKey(code) {
      return `hc_home_${code}`;
    }

    function saveLocal(code, data) {
      if (!code) return;
      try {
        localStorage.setItem(localStorageKey(code), JSON.stringify(data));
        localStorage.setItem("hc_last_home", code);
      } catch (_) {}
    }

    function loadLocal(code) {
      if (!code) return null;
      try {
        const raw = localStorage.getItem(localStorageKey(code));
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function sanitizeRemoteData(raw) {
      const base = DEFAULT_HOME_DATA();
      if (!raw || typeof raw !== "object") return base;
      return {
        meta: { ...base.meta, ...(raw.meta || {}), ownerNames: Array.isArray(raw.meta?.ownerNames) ? raw.meta.ownerNames : [] },
        employees: raw.employees && typeof raw.employees === "object" ? raw.employees : {},
        shifts: raw.shifts && typeof raw.shifts === "object" ? raw.shifts : {},
        tasks: raw.tasks && typeof raw.tasks === "object" ? raw.tasks : {},
        chats: raw.chats && typeof raw.chats === "object" ? raw.chats : {},
        closures: raw.closures && typeof raw.closures === "object" ? raw.closures : {}
      };
    }

    function detectNewChatMessages(prevData, nextData) {
      const prevChats = prevData.chats || {};
      const nextChats = nextData.chats || {};
      for (const empId of Object.keys(nextChats)) {
        const prevMsgs = prevChats[empId] || {};
        const nextMsgs = nextChats[empId] || {};
        for (const msgId of Object.keys(nextMsgs)) {
          if (!prevMsgs[msgId]) {
            const isViewingThisChat =
              (state.role === "employee" && state.activeEmpId === empId && state.empTab === "chat") ||
              (state.role === "owner" && state.ownerSubTab === "chat" && state.ownerChatEmpId === empId);
            if (!isViewingThisChat) {
              triggerChatPipPipAlarm(empId);
            }
          }
        }
      }
    }

    async function pushToFirebase(code, data) {
      if (!code) return;
      data.meta = { ...(data.meta || {}), updatedAt: Date.now() };
      saveLocal(code, data);
      state.syncStatus = "syncing";
      try {
        const resp = await fetch(`${FIREBASE_DB_URL}/homes/${encodeURIComponent(code)}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        state.syncStatus = resp.ok ? "connected" : "local";
      } catch (_) {
        state.syncStatus = "local";
      }
    }

    async function pullFromFirebase(code, notifyNew = true) {
      if (!code) return null;
      try {
        const resp = await fetch(`${FIREBASE_DB_URL}/homes/${encodeURIComponent(code)}.json`);
        if (!resp.ok) {
          state.syncStatus = "local";
          return null;
        }
        const remote = await resp.json();
        state.syncStatus = "connected";
        if (!remote) return null;
        const cleanRemote = sanitizeRemoteData(remote);
        const local = loadLocal(code);
        const remoteTs = cleanRemote.meta?.updatedAt || 0;
        const localTs = local?.meta?.updatedAt || 0;

        if (remoteTs >= localTs) {
          if (notifyNew) detectNewChatMessages(state.data, cleanRemote);
          state.data = cleanRemote;
          saveLocal(code, cleanRemote);
          return cleanRemote;
        } else if (local && localTs > remoteTs) {
          state.data = local;
          await pushToFirebase(code, local);
          return local;
        }
        return cleanRemote;
      } catch (_) {
        state.syncStatus = "local";
        return null;
      }
    }

    function startRealtimeSync(code) {
      stopRealtimeSync();
      if (!code) return;
      pullFromFirebase(code, false).then(() => render());
      state.pollTimer = setInterval(async () => {
        if (!state.homeCode || state.isBusyAction) return;
        const prevJson = JSON.stringify(state.data);
        await pullFromFirebase(state.homeCode, true);
        if (JSON.stringify(state.data) !== prevJson) {
          render();
        }
      }, 2500);
    }

    function stopRealtimeSync() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    // =========================================================================
    // ACCIONES DE DOMINIO
    // =========================================================================
    function addChatMessageLocal(empId, senderRole, senderName, text, kind = "user") {
      if (!empId || !text || !text.trim()) return;
      if (!state.data.chats) state.data.chats = {};
      if (!state.data.chats[empId]) state.data.chats[empId] = {};
      const id = `msg_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      state.data.chats[empId][id] = {
        id,
        senderRole,
        senderName,
        text: text.trim(),
        kind,
        ts: Date.now()
      };
    }

    async function appendChatMessage(empId, senderRole, senderName, text, kind = "user") {
      if (!empId || !text || !text.trim()) return;
      addChatMessageLocal(empId, senderRole, senderName, text, kind);
      saveLocal(state.homeCode, state.data);
      render();
      await pushToFirebase(state.homeCode, state.data);
      render();
    }

    function hasOpenShift(empId) {
      return Object.values(state.data.shifts || {}).some(
        (s) => s.empId === empId && s.status === "open"
      );
    }

    function getOpenShift(empId) {
      return Object.values(state.data.shifts || {}).find(
        (s) => s.empId === empId && s.status === "open"
      ) || null;
    }

    async function clockInEmployee(empId) {
      if (state.isBusyAction) return;
      const emp = state.data.employees[empId];
      if (!emp || hasOpenShift(empId)) return;

      state.isBusyAction = true;
      try {
        const now = Date.now();
        const shiftId = `sh_${now}_${Math.random().toString(36).slice(2, 6)}`;
        const dateStr = toDateStr(now);
        if (!state.data.shifts) state.data.shifts = {};
        state.data.shifts[shiftId] = {
          id: shiftId,
          empId,
          date: dateStr,
          startTs: now,
          endTs: null,
          status: "open",
          confirmedBy: null,
          confirmedAt: null,
          adjustedBy: null,
          adjustedAt: null,
          excessNotified: false,
          excessReviewed: false
        };
        addChatMessageLocal(
          empId,
          "employee",
          emp.name,
          `Entrada fichada a las ${formatTimeHM(now)} (${formatDateShort(dateStr)}). Turno en curso.`,
          "system"
        );
        saveLocal(state.homeCode, state.data);
        render();
        await pushToFirebase(state.homeCode, state.data);
        render();
      } finally {
        state.isBusyAction = false;
      }
    }

    async function clockOutEmployee(empId) {
      if (state.isBusyAction) return;
      const emp = state.data.employees[empId];
      const openShift = getOpenShift(empId);
      if (!emp || !openShift) return;

      state.isBusyAction = true;
      try {
        const now = Date.now();
        const safeEnd = Math.max(openShift.startTs + 60000, now);
        openShift.endTs = safeEnd;
        openShift.status = "pending";

        const dur = msToHoursMinutes(safeEnd - openShift.startTs);
        const allowedMinutes = (Number(emp.dailyHours) || 8) * 60 + 60;
        const exceedsOneHour = dur.totalMinutes > allowedMinutes;
        if (exceedsOneHour) {
          openShift.excessNotified = true;
          openShift.excessReviewed = false;
        }

        const baseMsg = `Salida fichada a las ${formatTimeHM(safeEnd)} (${dur.text}). Pendiente de confirmación.`;
        const alertMsg = exceedsOneHour
          ? ` ⚠️ EXCESO (+1h sobre ficha de ${emp.dailyHours}h): revisar y ajustar hora real de salida.`
          : "";

        addChatMessageLocal(empId, "employee", emp.name, baseMsg + alertMsg, "system");
        saveLocal(state.homeCode, state.data);
        render();
        await pushToFirebase(state.homeCode, state.data);
        render();
      } finally {
        state.isBusyAction = false;
      }
    }

    async function confirmShift(shiftId) {
      const shift = state.data.shifts[shiftId];
      if (!shift || !shift.endTs) return;
      const emp = state.data.employees[shift.empId];
      const actor = getCurrentOwnerLabel();
      shift.status = "confirmed";
      shift.confirmedAt = Date.now();
      shift.confirmedBy = actor;
      shift.excessNotified = false;
      shift.excessReviewed = true;

      const dur = msToHoursMinutes(shift.endTs - shift.startTs);
      const rate = getRateForDate(emp, shift.date);
      const exactEur = formatOneDecimalEuro((dur.totalMinutes / 60) * rate);

      await appendChatMessage(
        shift.empId,
        "owner",
        actor,
        `${actor} ha confirmado el turno (${formatDateShort(shift.date)} ${formatTimeHM(shift.startTs)}–${formatTimeHM(shift.endTs)}, ${dur.text} · ${exactEur}). Calendario actualizado.`,
        "system"
      );
    }

    async function saveAdjustedShift(shiftId, newStartStr, newEndStr, alsoConfirm) {
      const shift = state.data.shifts[shiftId];
      if (!shift) return;
      const actor = getCurrentOwnerLabel();
      const [y, m, d] = shift.date.split("-").map(Number);

      const [sh, sm] = newStartStr.split(":").map(Number);
      const startDate = new Date(y, m - 1, d, sh, sm, 0, 0);

      const [eh, em] = newEndStr.split(":").map(Number);
      let endDate = new Date(y, m - 1, d, eh, em, 0, 0);
      if (endDate.getTime() <= startDate.getTime()) {
        endDate = new Date(endDate.getTime() + 86400000);
      }

      shift.startTs = startDate.getTime();
      shift.endTs = endDate.getTime();
      shift.adjustedBy = actor;
      shift.adjustedAt = Date.now();
      shift.excessNotified = false;
      shift.excessReviewed = true;

      if (alsoConfirm) {
        shift.status = "confirmed";
        shift.confirmedAt = Date.now();
        shift.confirmedBy = actor;
      } else if (shift.status === "open") {
        shift.status = "pending";
      }

      const dur = msToHoursMinutes(shift.endTs - shift.startTs);
      const statusText = shift.status === "confirmed" ? "CONFIRMADO" : "PENDIENTE DE CONFIRMAR";

      await appendChatMessage(
        shift.empId,
        "owner",
        actor,
        `${actor} ha ajustado el turno (${formatDateShort(shift.date)}: ${formatTimeHM(shift.startTs)}–${formatTimeHM(shift.endTs)}, ${dur.text}) · ${statusText}.`,
        "system"
      );
    }

    // =========================================================================
    // MODALES INTERACTIVOS
    // =========================================================================
    function openModal(html) {
      const root = document.getElementById("modal-root");
      const box = document.getElementById("modal-box");
      box.innerHTML = html;
      root.classList.remove("hidden");
      root.classList.add("flex");
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      root.classList.add("hidden");

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // =========================================================================
    // RENDERIZADO PRINCIPAL
    // =========================================================================
    function render() {
      document.body.classList.toggle("tablet-force", state.tabletMode);
      const app = document.getElementById("app");
      app.className = state.tabletMode
        ? "h-dvh flex flex-col max-w-4xl mx-auto transition-all duration-200 overflow-hidden"
        : "h-dvh flex flex-col max-w-md mx-auto transition-all duration-200 overflow-hidden";

      if (!state.homeCode || !state.role) {
        app.innerHTML = renderAccessScreen();
        bindAccessScreen();
        return;
      }

      if (state.role === "employee") {
        const emp = state.data.employees[state.activeEmpId];
        if (!emp) {
          state.role = null;
          state.activeEmpId = null;
          app.innerHTML = renderAccessScreen();
          bindAccessScreen();
          return;
        }
        app.innerHTML = renderEmployeeScreen(emp);
        bindEmployeeScreen(emp);
        return;
      }

      if (state.role === "owner") {
        app.innerHTML = renderOwnerScreen();
        bindOwnerScreen();
      }
    }

    // =========================================================================

                <button id="btn-load-home" type="button" class="px-4 py-2.5 rounded-2xl bg-sky-100 hover:bg-sky-200 border border-sky-300 text-xs font-extrabold text-sky-900 shrink-0">

            </div>

                <div class="text-base font-extrabold tracking-tight">PROPIETARIO</div>

                <div class="text-base font-extrabold tracking-tight">EMPLEADA</div>
                <div class="text-xs mt-0.5 ${state.loginPanel === "employee" ? "text-emerald-100" : "text-slate-500"}">

            </div>

            ${state.loginPanel === "owner" ? `

                <input id="owner-name-input" type="text" value="${escapeHtml(state.ownerName)}" placeholder="Tu nombre (ej: Fran, Cris...)"
                  class="w-full rounded-2xl bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 font-semibold focus:outline-none focus:border-sky-500" />

    function bindAccessScreen() {
      document.getElementById("btn-toggle-tablet").onclick = () => {
        state.tabletMode = !state.tabletMode;
        localStorage.setItem("hc_tablet_mode", state.tabletMode ? "1" : "0");
        render();
      };

      document.getElementById("open-owner-login").onclick = async () => {
        const codeInput = document.getElementById("access-home-code");
        const code = (codeInput?.value || state.homeCode || "").trim().toUpperCase();
        if (code) {
          state.homeCode = code;
          const local = loadLocal(code);
          state.data = local ? sanitizeRemoteData(local) : DEFAULT_HOME_DATA();
          await pullFromFirebase(code, false);
        }
        state.loginPanel = state.loginPanel === "owner" ? null : "owner";
        render();
      };

      document.getElementById("open-emp-login").onclick = async () => {
        const codeInput = document.getElementById("access-home-code");
        const code = (codeInput?.value || state.homeCode || "").trim().toUpperCase();
        if (code) {
          state.homeCode = code;
          const local = loadLocal(code);
          state.data = local ? sanitizeRemoteData(local) : DEFAULT_HOME_DATA();
          await pullFromFirebase(code, false);
        }
        state.loginPanel = state.loginPanel === "employee" ? null : "employee";
        render();
      };

      const closeBtn = document.getElementById("close-login-panel");
      if (closeBtn) {
        closeBtn.onclick = () => {
          state.loginPanel = null;
          render();
        };
      }

      document.querySelectorAll(".quick-owner-chip").forEach((chip) => {
        chip.onclick = () => {
          const picked = chip.dataset.quickowner || "";
          state.ownerName = picked;
          localStorage.setItem("hc_owner_name", picked);
          const input = document.getElementById("owner-name-input");
          if (input) input.value = picked;
          render();
        };
      });

      document.getElementById("btn-load-home").onclick = async () => {
        const code = document.getElementById("access-home-code").value.trim().toUpperCase();
        if (!code) return;
        state.homeCode = code;
        const local = loadLocal(code);
        state.data = local ? sanitizeRemoteData(local) : DEFAULT_HOME_DATA();
        await pullFromFirebase(code, false);
        render();
      };

      const btnOwner = document.getElementById("btn-enter-owner");
      if (btnOwner) {
        btnOwner.onclick = async () => {
          const code = document.getElementById("access-home-code").value.trim().toUpperCase();
          const chosenName = document.getElementById("owner-name-input").value.trim();
          const pass = document.getElementById("owner-pass-input").value;
          const isMasterChecked = document.getElementById("owner-master-check").checked;
          const errEl = document.getElementById("owner-auth-err");

          if (!code) {
            errEl.textContent = "Introduce un código de hogar.";
            errEl.classList.remove("hidden");
            return;
          }
          if (!chosenName) {
            errEl.textContent = "Pon tu nombre (ej. Fran o Cris) para identificarte.";
            errEl.classList.remove("hidden");
            return;
          }
          if (!pass) {
            errEl.textContent = "Introduce la contraseña máster.";
            errEl.classList.remove("hidden");
            return;
          }

          state.homeCode = code;
          const local = loadLocal(code);
          state.data = local ? sanitizeRemoteData(local) : DEFAULT_HOME_DATA();
          await pullFromFirebase(code, false);

          const existingHash = state.data.meta?.masterPasswordHash;
          if (!existingHash) {
            state.data.meta.masterPasswordHash = btoa(unescape(encodeURIComponent(pass)));
            registerOwnerName(chosenName);
            await pushToFirebase(code, state.data);
          } else {
            const inputHash = btoa(unescape(encodeURIComponent(pass)));
            if (inputHash !== existingHash) {
              errEl.textContent = "Contraseña máster incorrecta.";
              errEl.classList.remove("hidden");
              return;
            }
            registerOwnerName(chosenName);
            await pushToFirebase(code, state.data);
          }

          state.role = "owner";
          state.loginPanel = null;
          state.isMaster = isMasterChecked;
          const firstEmp = Object.values(state.data.employees || {})[0];
          if (firstEmp) {
            state.ownerChatEmpId = state.ownerChatEmpId || firstEmp.id;
            state.ownerCalEmpId = state.ownerCalEmpId || firstEmp.id;
          }
          startRealtimeSync(code);
          render();
        };
      }

      const btnEmp = document.getElementById("btn-enter-emp");
      if (btnEmp) {
        btnEmp.onclick = async () => {
          const code = document.getElementById("access-home-code").value.trim().toUpperCase();
          const empId = document.getElementById("emp-select").value;
          const pass = document.getElementById("emp-pass-input").value;
          const errEl = document.getElementById("emp-auth-err");

          if (!code) return;
          state.homeCode = code;
          const local = loadLocal(code);
          state.data = local ? sanitizeRemoteData(local) : DEFAULT_HOME_DATA();
          await pullFromFirebase(code, false);

          const emp = state.data.employees[empId];
          if (!emp || emp.password !== pass) {
            errEl.textContent = "Contraseña de empleada incorrecta.";
            errEl.classList.remove("hidden");
            return;
          }

          state.role = "employee";
          state.loginPanel = null;
          state.activeEmpId = emp.id;
          state.empTab = "work";
          startRealtimeSync(code);
          render();
        };
      }
    }

    // =========================================================================
    // PANTALLA EMPLEADA (BOTONES ENTRADA / SALIDA AMPLIOS + MÁX. 1 DECIMAL)
    // =========================================================================
    function renderEmployeeScreen(emp) {
      const openShift = getOpenShift(emp.id);
      const todayStr = toDateStr(Date.now());
      const todaySummary = getDayStatusSummary(emp.id, todayStr);
      const todayTasks = Object.values(state.data.tasks || {}).filter(
        (t) => t.empId === emp.id && t.date === todayStr
      );
      const isBlinking = Boolean(state.blinkingChat[emp.id]);

      const elapsedStr = openShift
        ? msToHoursMinutes(Date.now() - openShift.startTs).text
        : msToHoursMinutes(todaySummary.totalMs).text;

      return `
        <div class="flex-1 flex flex-col justify-between p-2.5 gap-2 min-h-0">
          <header class="hc-card rounded-2xl px-3.5 py-2.5 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full ${state.syncStatus === "connected" ? "bg-emerald-500" : "bg-amber-500"} shrink-0"></span>
              <span class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(emp.name)}</span>

            <div class="flex items-center gap-1.5 shrink-0">

                ${state.tabletMode ? "Móvil" : "Tablet"}
              </button>
              <button id="emp-logout" type="button" class="px-2.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700">
                Salir
              </button>
            </div>
          </header>

          <main class="flex-1 flex flex-col gap-2 min-h-0 overflow-y-auto no-scrollbar">
            ${state.empTab === "work" ? renderEmployeeWorkTab(emp, openShift, elapsedStr, todayTasks) : ""}
            ${state.empTab === "calendar" ? renderCalendarAndPaymentsSection(emp.id, state.calMonth, false, false) : ""}
            ${state.empTab === "chat" ? renderChatView(emp.id, "employee", emp.name) : ""}
          </main>

          <nav class="grid grid-cols-3 gap-2 hc-card rounded-2xl p-1.5 shrink-0">
            <button data-emptab="work" type="button" class="emp-nav-btn py-2.5 rounded-xl text-xs font-extrabold ${state.empTab === "work" ? "bg-sky-600 text-white" : "text-slate-700 bg-slate-50"}">
              Fichar / Tareas
            </button>
            <button data-emptab="calendar" type="button" class="emp-nav-btn py-2.5 rounded-xl text-xs font-extrabold ${state.empTab === "calendar" ? "bg-sky-600 text-white" : "text-slate-700 bg-slate-50"}">
              Calendario
            </button>
            <button data-emptab="chat" type="button" class="emp-nav-btn py-2.5 rounded-xl text-xs font-extrabold ${isBlinking ? "chat-alert-blink text-amber-950" : state.empTab === "chat" ? "bg-amber-500 text-slate-950" : "text-slate-700 bg-slate-50"}">
              Chat ${isBlinking ? "🔔" : ""}
            </button>
          </nav>
        </div>
      `;
    }

    function renderEmployeeWorkTab(emp, openShift, elapsedStr, todayTasks) {
      return `
        <div class="split-pane flex-1 flex flex-col gap-2.5">
          <section class="hc-card rounded-3xl p-4 flex flex-col justify-between gap-4">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                ${openShift ? "Turno en curso" : "Cronómetro hoy"}
              </span>
              <span class="text-xs font-bold ${openShift ? "text-emerald-700" : "text-slate-500"}">
                ${openShift ? `Entrada ${formatTimeHM(openShift.startTs)}` : "Sin entrada activa"}
              </span>
            </div>

            <div id="emp-live-timer" class="text-4xl sm:text-5xl font-extrabold tracking-tight text-center py-2 text-slate-900">
              ${elapsedStr}
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button id="btn-clock-in" type="button" ${openShift ? "disabled" : ""}
                class="py-6 sm:py-7 rounded-3xl text-base sm:text-lg font-extrabold tracking-wide transition ${openShift ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm active:scale-[0.98]"}">
                ENTRADA
              </button>
              <button id="btn-clock-out" type="button" ${!openShift ? "disabled" : ""}
                class="py-6 sm:py-7 rounded-3xl text-base sm:text-lg font-extrabold tracking-wide transition ${!openShift ? "bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed" : "bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm active:scale-[0.98]"}">
                SALIDA
              </button>
            </div>
          </section>

          <section class="hc-card rounded-3xl p-4 flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold text-sky-900 uppercase tracking-wider">Tareas de hoy</span>
              <span class="text-xs font-bold text-slate-500">${todayTasks.filter((t) => t.done).length}/${todayTasks.length}</span>
            </div>
            ${todayTasks.length === 0 ? `
              <div class="flex-1 flex items-center justify-center text-xs text-slate-400 py-4">Sin tareas especiales hoy</div>
            ` : `
              <div class="space-y-2 overflow-y-auto no-scrollbar">
                ${todayTasks.map((t) => `
                  <label class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-200 cursor-pointer">
                    <input type="checkbox" data-taskid="${t.id}" ${t.done ? "checked" : ""} class="emp-task-check w-5 h-5 rounded accent-emerald-600" />
                    <span class="text-xs font-semibold ${t.done ? "line-through text-slate-400" : "text-slate-800"}">${escapeHtml(t.title)}</span>
                  </label>
                `).join("")}
              </div>
            `}
          </section>
        </div>
      `;
    }

    function bindEmployeeScreen(emp) {
      document.getElementById("emp-toggle-tablet").onclick = () => {
        state.tabletMode = !state.tabletMode;
        localStorage.setItem("hc_tablet_mode", state.tabletMode ? "1" : "0");
        render();
      };
      document.getElementById("emp-logout").onclick = () => {
        stopRealtimeSync();
        state.role = null;
        state.activeEmpId = null;
        render();
      };
      document.querySelectorAll(".emp-nav-btn").forEach((btn) => {
        btn.onclick = () => {
          state.empTab = btn.dataset.emptab;
          if (state.empTab === "chat") stopChatAlarmFor(emp.id);
          render();
        };
      });

      const btnIn = document.getElementById("btn-clock-in");
      if (btnIn && !btnIn.disabled) {
        btnIn.onclick = (e) => {
          e.preventDefault();
          clockInEmployee(emp.id);
        };
      }
      const btnOut = document.getElementById("btn-clock-out");
      if (btnOut && !btnOut.disabled) {
        btnOut.onclick = (e) => {
          e.preventDefault();
          promptClockOutConfirm(emp.id);
        };
      }

      document.querySelectorAll(".emp-task-check").forEach((chk) => {
        chk.onchange = async () => {
          const t = state.data.tasks[chk.dataset.taskid];
          if (!t) return;
          t.done = chk.checked;
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      });

      bindCalendarAndPaymentsControls(emp.id, false);
      bindChatControls(emp.id, "employee", emp.name);
      startClockTicker();
    }

    // =========================================================================
    // PANTALLA PROPIETARIO
    // =========================================================================
    function renderOwnerScreen() {
      const employees = Object.values(state.data.employees || {});
      const pendingShifts = Object.values(state.data.shifts || {})
        .filter((s) => s.status === "pending")
        .sort((a, b) => (b.endTs || b.startTs) - (a.endTs || a.startTs));

      const unreviewedExcessShifts = Object.values(state.data.shifts || {})
        .filter((s) => isShiftExcessUnreviewed(s))
        .sort((a, b) => (b.endTs || b.startTs) - (a.endTs || a.startTs));

      const anyChatBlink = Object.values(state.blinkingChat || {}).some(Boolean);
      const ownerLabel = getCurrentOwnerLabel();
      const firstExcessShift = unreviewedExcessShifts[0] || null;

      return `
        <div class="flex-1 flex flex-col p-2.5 gap-2 min-h-0">
          <!-- Cabecera superior: Empleadas y Mes / Pago junto a la rueda de ajustes -->
          <header class="hc-card rounded-2xl px-3 py-2 flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full ${state.syncStatus === "connected" ? "bg-emerald-500" : "bg-amber-500"} shrink-0"></span>
              <div class="truncate">
                <span class="text-xs font-extrabold text-slate-900">${escapeHtml(ownerLabel)}</span>
                <span class="text-[10px] text-sky-700 font-extrabold ml-1">${escapeHtml(state.homeCode)}</span>
              </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button data-otab="employees" type="button" class="o-tab px-2.5 py-1.5 rounded-xl text-xs font-extrabold ${state.ownerSubTab === "employees" ? "bg-sky-600 text-white" : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"}">
                Empleadas
              </button>
              <button data-otab="closures" type="button" class="o-tab px-2.5 py-1.5 rounded-xl text-xs font-extrabold ${state.ownerSubTab === "closures" ? "bg-blue-600 text-white" : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"}">
                Mes / Pago
              </button>
              <button id="owner-gear-btn" type="button" title="Ajustes" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-extrabold text-slate-800">
                ⚙️
              </button>
              <button id="owner-logout" type="button" class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-xs font-bold text-rose-700">
                Salir
              </button>
            </div>
          </header>

          <!-- Aviso +1h con botón Revisar que lleva al turno y desaparece al revisar -->
          ${firstExcessShift ? `
            <div class="rounded-2xl bg-amber-100 border border-amber-400 px-3 py-2 text-xs text-amber-950 font-bold flex items-center justify-between gap-2 shrink-0">
              <div class="min-w-0">
                ⚠️ Exceso (+1h sobre ficha): ${unreviewedExcessShifts.length} turno(s) por revisar.
              </div>
              <button id="btn-review-excess" data-shiftid="${firstExcessShift.id}" type="button"
                class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold shrink-0 shadow-2xs">
                Revisar
              </button>
            </div>
          ` : ""}

          <!-- Contenido principal -->
          <div class="flex-1 flex flex-col gap-2 min-h-0 ${state.ownerSubTab === "chat" ? "" : "overflow-y-auto no-scrollbar"}">
            ${state.ownerSubTab === "shifts" ? renderOwnerShiftsTab(employees, pendingShifts) : ""}
            ${state.ownerSubTab === "closures" ? renderOwnerCalendarAndPaymentsTab(employees) : ""}
            ${state.ownerSubTab === "tasks" ? renderOwnerTasksTab(employees) : ""}
            ${state.ownerSubTab === "employees" ? renderOwnerEmployeesTab(employees) : ""}
            ${state.ownerSubTab === "chat" ? renderOwnerChatTab(employees) : ""}
          </div>

          <!-- Barra principal inferior: Turnos, Tareas y Chat -->
          <nav class="grid grid-cols-3 gap-2 hc-card rounded-2xl p-1.5 text-xs font-extrabold shrink-0">
            <button data-otab="shifts" type="button" class="o-tab py-2.5 rounded-xl ${state.ownerSubTab === "shifts" ? "bg-sky-600 text-white" : "text-slate-700 bg-slate-50"}">
              Turnos ${pendingShifts.length ? `(${pendingShifts.length})` : ""}
            </button>
            <button data-otab="tasks" type="button" class="o-tab py-2.5 rounded-xl ${state.ownerSubTab === "tasks" ? "bg-sky-600 text-white" : "text-slate-700 bg-slate-50"}">
              Tareas
            </button>
            <button data-otab="chat" type="button" class="o-tab py-2.5 rounded-xl ${anyChatBlink ? "chat-alert-blink text-amber-950" : state.ownerSubTab === "chat" ? "bg-amber-500 text-slate-950" : "text-slate-700 bg-slate-50"}">
              Chat ${anyChatBlink ? "🔔" : ""}
            </button>
          </nav>
        </div>
      `;
    }

    function renderOwnerCalendarAndPaymentsTab(employees) {
      const selectedEmpId = state.ownerCalEmpId || employees[0]?.id || null;
      if (!selectedEmpId || employees.length === 0) {
        return `
          <div class="hc-card rounded-3xl p-4 text-center text-xs text-slate-500">
            Añade una empleada en <strong>Empleadas</strong> para ver su calendario y cierre mensual.
          </div>
        `;
      }

      return `
        <div class="space-y-2.5">
          <div class="hc-card rounded-2xl px-3.5 py-2.5 flex items-center gap-3">
            <span class="text-xs font-bold text-slate-600 shrink-0">Empleada:</span>
            <select id="owner-cal-emp" class="flex-1 min-w-0 rounded-xl bg-slate-50 border border-slate-300 px-3 py-2 text-sm text-slate-900 font-extrabold">
              ${employees.map((e) => `<option value="${e.id}" ${e.id === selectedEmpId ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("")}
            </select>
          </div>

          ${renderCalendarAndPaymentsSection(selectedEmpId, state.ownerCalMonth, true, true)}
        </div>
      `;
    }

    function renderOwnerShiftsTab(employees, pendingShifts) {
      const calEmpId = state.ownerCalEmpId || employees[0]?.id || null;
      const allShifts = Object.values(state.data.shifts || {})
        .filter((s) => !calEmpId || s.empId === calEmpId)
        .sort((a, b) => b.startTs - a.startTs);

      return `
        <div class="split-pane flex flex-col gap-2.5">
          <section class="hc-card rounded-3xl p-3.5 space-y-2.5">
            <div class="text-xs font-extrabold text-amber-800 uppercase tracking-wider">Pendientes de confirmar (${pendingShifts.length})</div>
            ${pendingShifts.length === 0 ? `
              <div class="text-xs text-slate-500 py-1">No hay turnos pendientes de confirmar.</div>
            ` : pendingShifts.map((s) => {
              const emp = state.data.employees[s.empId];
              const dur = msToHoursMinutes((s.endTs || Date.now()) - s.startTs);
              const rate = getRateForDate(emp, s.date);
              const eur = formatOneDecimalEuro((dur.totalMinutes / 60) * rate);
              return `
                <div class="rounded-2xl bg-amber-50 border border-amber-300 p-3 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(emp?.name || "")} · ${s.date}</div>
                    <div class="text-xs text-amber-900 font-semibold">${formatTimeHM(s.startTs)} – ${formatTimeHM(s.endTs)} (${dur.text} · ${eur})</div>
                  </div>
                  <div class="flex gap-1.5 shrink-0">
                    <button data-editshift="${s.id}" type="button" class="btn-edit-shift px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-bold text-sky-700">Ajustar</button>
                    <button data-confirmshift="${s.id}" type="button" class="btn-confirm-shift px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Confirmar</button>
                  </div>
                </div>
              `;
            }).join("")}

            <div class="text-xs font-extrabold text-sky-800 uppercase tracking-wider pt-2 border-t border-slate-200">Turnos recientes</div>
            <div class="space-y-1.5 max-h-60 overflow-y-auto no-scrollbar">
              ${allShifts.slice(0, 12).map((s) => {
                const dur = msToHoursMinutes(getShiftDurationMs(s));
                const badgeClass =
                  s.status === "confirmed"
                    ? "bg-emerald-100 text-emerald-800 border-emerald-300"
                    : s.status === "pending"
                    ? "bg-amber-100 text-amber-900 border-amber-300"
                    : "bg-sky-100 text-sky-800 border-sky-300";
                const actorTag = s.confirmedBy ? ` · ${s.confirmedBy}` : s.adjustedBy ? ` · ${s.adjustedBy}` : "";
                return `
                  <div class="rounded-2xl bg-slate-50 border border-slate-200 p-2.5 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="text-xs font-bold text-slate-900">${s.date} · ${formatTimeHM(s.startTs)}–${s.endTs ? formatTimeHM(s.endTs) : "en curso"} (${dur.text})</div>
                      <span class="inline-block mt-1 px-2 py-0.5 rounded-lg text-[10px] font-extrabold border ${badgeClass}">${s.status.toUpperCase()}${escapeHtml(actorTag)}</span>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                      ${s.status === "pending" ? `<button data-confirmshift="${s.id}" type="button" class="btn-confirm-shift px-2.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Confirmar</button>` : ""}
                      ${s.status !== "open" ? `<button data-editshift="${s.id}" type="button" class="btn-edit-shift px-2.5 py-1.5 rounded-xl bg-white border border-slate-300 text-xs font-bold text-sky-700">Editar</button>` : ""}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderOwnerEmployeesTab(employees) {
      const knownOwners = Array.isArray(state.data.meta?.ownerNames) ? state.data.meta.ownerNames : [];
      return `
        <div class="split-pane flex flex-col gap-2.5">
          <section class="hc-card rounded-3xl p-3.5 space-y-2.5">

            <input id="new-emp-pass" type="text" placeholder="Contraseña (por defecto nombre en minúsculas)" class="w-full rounded-2xl bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-xs text-slate-900" />

                <label class="block text-[11px] text-slate-600 font-semibold mb-1">Horas diarias ficha</label>

              </div>

            <button id="btn-add-emp" type="button" class="w-full py-3 rounded-2xl bg-emerald-600 text-white text-xs font-extrabold">Añadir empleada</button>

            <div class="pt-2.5 border-t border-slate-200 space-y-2">
              <div class="text-xs font-extrabold text-slate-800">Propietarios del hogar (${knownOwners.length})</div>
              <div class="flex flex-wrap gap-1.5">
                ${knownOwners.map((n) => `<span class="px-3 py-1 rounded-full bg-sky-50 border border-sky-200 text-xs font-bold text-sky-800">${escapeHtml(n)}</span>`).join("")}
              </div>
              <div class="flex gap-1.5">
                <input id="add-owner-name-input" type="text" placeholder="Añadir nombre (ej: Cris)" class="flex-1 min-w-0 rounded-2xl bg-slate-50 border border-slate-300 px-3 py-2 text-xs text-slate-900" />
                <button id="btn-add-owner-name" type="button" class="px-4 py-2 rounded-2xl bg-sky-600 text-white text-xs font-extrabold shrink-0">Añadir</button>
              </div>
            </div>
          </section>

          <section class="hc-card rounded-3xl p-3.5 space-y-2.5">
            <div class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Empleadas registradas (${employees.length})</div>
            ${employees.length === 0 ? `<div class="text-xs text-slate-500">Sin empleadas todavía.</div>` : employees.map((e) => {
              const currentRate = getRateForDate(e, toDateStr(Date.now()));
              return `
                <div class="rounded-2xl bg-slate-50 border border-slate-200 p-3 space-y-2">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="text-xs font-extrabold text-slate-900">${escapeHtml(e.name)}</div>
                      <div class="text-xs text-slate-600">Tarifa: <strong class="text-emerald-700">${formatOneDecimalEuro(currentRate)}/h</strong> · Ficha: <strong class="text-sky-700">${e.dailyHours}h/día</strong></div>
                    </div>
                    <button data-delemp="${e.id}" type="button" class="btn-del-emp px-2.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700">Eliminar</button>
                  </div>
                  <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-slate-200">
                    <input id="rate-val-${e.id}" type="number" step="0.1" value="${oneDecimalNumber(currentRate)}" class="rounded-xl bg-white border border-slate-300 px-2.5 py-1.5 text-xs text-slate-900" />
                    <input id="rate-date-${e.id}" type="date" value="${toDateStr(Date.now())}" class="rounded-xl bg-white border border-slate-300 px-2 py-1.5 text-xs text-slate-900" />
                    <button data-saverate="${e.id}" type="button" class="btn-save-rate rounded-xl bg-sky-600 text-white text-xs font-extrabold">Aplicar</button>
                  </div>
                </div>
              `;
            }).join("")}

            ${state.isMaster ? `
              <div class="pt-2 border-t border-slate-200 space-y-1.5">
                <div class="text-xs font-bold text-slate-700">Cambiar contraseña máster</div>
                <div class="flex gap-1.5">
                  <input id="new-master-pass" type="password" placeholder="Nueva clave máster" class="flex-1 min-w-0 rounded-2xl bg-slate-50 border border-slate-300 px-3 py-2 text-xs text-slate-900" />
                  <button id="btn-change-master" type="button" class="px-4 py-2 rounded-2xl bg-slate-800 text-white text-xs font-bold shrink-0">Guardar</button>
                </div>
              </div>
            ` : ""}
          </section>
        </div>
      `;
    }

    function renderOwnerTasksTab(employees) {
      const tasks = Object.values(state.data.tasks || {}).sort((a, b) => b.createdAt - a.createdAt);
      return `
        <div class="split-pane flex flex-col gap-2.5">
          <section class="hc-card rounded-3xl p-3.5 space-y-2.5">
            <div class="text-xs font-extrabold text-sky-800 uppercase tracking-wider">Asignar tarea especial</div>
            <select id="task-emp-select" class="w-full rounded-2xl bg-slate-50 border border-slate-300 px-3 py-2.5 text-xs text-slate-900 font-semibold">
