            </select>
            <input id="task-title-input" type="text" placeholder="Ej: Limpiar hornos o cambiar sábanas" class="w-full rounded-2xl bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-xs text-slate-900" />
            <div class="flex items-center gap-2">
              <input id="task-date-input" type="date" value="${toDateStr(Date.now())}" class="flex-1 min-w-0 rounded-2xl bg-slate-50 border border-slate-300 px-3 py-2 text-xs text-slate-900" />
              <button id="btn-task-today" type="button" class="px-3.5 py-2 rounded-2xl bg-sky-100 text-xs font-extrabold text-sky-800 shrink-0">Hoy</button>
            </div>
            <button id="btn-add-task" type="button" class="w-full py-3 rounded-2xl bg-sky-600 text-white text-xs font-extrabold">Asignar tarea</button>
          </section>

          <section class="hc-card rounded-3xl p-3.5 space-y-2">
            <div class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Tareas asignadas</div>
            ${tasks.length === 0 ? `<div class="text-xs text-slate-500">Sin tareas creadas.</div>` : tasks.map((t) => {
              const emp = state.data.employees[t.empId];
              return `
                <div class="rounded-2xl bg-slate-50 border border-slate-200 p-2.5 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-xs ${t.done ? "line-through text-slate-400" : "text-slate-900 font-bold"} truncate">${escapeHtml(t.title)}</div>
                    <div class="text-[11px] text-slate-500">${escapeHtml(emp?.name || "")} · ${t.date} · ${t.done ? "Hecha" : "Pendiente"}</div>
                  </div>
                  <button data-deltask="${t.id}" type="button" class="btn-del-task px-2.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700">Borrar</button>
                </div>
              `;
            }).join("")}
          </section>
        </div>
      `;
    }

    function renderOwnerChatTab(employees) {
      const selectedId = state.ownerChatEmpId || employees[0]?.id || null;
      return `
        <div class="space-y-2 flex-1 flex flex-col min-h-0">
          ${employees.length > 0 ? `
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar shrink-0">
              ${employees.map((e) => {
                const blink = Boolean(state.blinkingChat[e.id]);
                const active = e.id === selectedId;
                return `
                  <button data-chatemp="${e.id}" type="button" class="btn-select-chatemp px-3.5 py-2 rounded-2xl text-xs font-extrabold shrink-0 ${blink ? "chat-alert-blink text-amber-950" : active ? "bg-amber-500 text-slate-950" : "bg-white border border-slate-200 text-slate-700"}">
                    ${escapeHtml(e.name)} ${blink ? "🔔" : ""}
                  </button>
                `;
              }).join("")}
            </div>
            ${selectedId ? renderChatView(selectedId, "owner", getCurrentOwnerLabel()) : ""}
          ` : `<div class="hc-card rounded-3xl p-4 text-xs text-slate-500">Crea una empleada para usar su chat.</div>`}
        </div>
      `;
    }

    function bindOwnerScreen() {
      const gearBtn = document.getElementById("owner-gear-btn");
      if (gearBtn) gearBtn.onclick = openOwnerSettingsGearModal;

      document.getElementById("owner-logout").onclick = () => {
        stopRealtimeSync();
        state.role = null;
        render();
      };

      const reviewExcessBtn = document.getElementById("btn-review-excess");
      if (reviewExcessBtn) {
        reviewExcessBtn.onclick = () => {
          const targetShiftId = reviewExcessBtn.dataset.shiftid;
          const targetShift = state.data.shifts[targetShiftId];
          if (targetShift) {
            state.ownerCalEmpId = targetShift.empId;
          }
          state.ownerSubTab = "shifts";
          render();
          if (targetShift) {
            openShiftEditorModal(targetShiftId);
          }
        };
      }

      document.querySelectorAll(".o-tab").forEach((btn) => {
        btn.onclick = () => {
          state.ownerSubTab = btn.dataset.otab;
          if (state.ownerSubTab === "chat" && state.ownerChatEmpId) {
            stopChatAlarmFor(state.ownerChatEmpId);
          }
          render();
        };
      });

      document.querySelectorAll(".btn-confirm-shift").forEach((btn) => {
        btn.onclick = () => confirmShift(btn.dataset.confirmshift);
      });
      document.querySelectorAll(".btn-edit-shift").forEach((btn) => {
        btn.onclick = () => openShiftEditorModal(btn.dataset.editshift);
      });

      const calEmpSel = document.getElementById("owner-cal-emp");
      if (calEmpSel) {
        calEmpSel.onchange = () => {
          state.ownerCalEmpId = calEmpSel.value;
          render();
        };
        bindCalendarAndPaymentsControls(calEmpSel.value, true);
      }

      const btnAddOwnerName = document.getElementById("btn-add-owner-name");
      if (btnAddOwnerName) {
        btnAddOwnerName.onclick = async () => {
          const input = document.getElementById("add-owner-name-input");
          const val = input.value.trim();
          if (!val) return;
          registerOwnerName(val);
          input.value = "";
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      }

      const btnAddEmp = document.getElementById("btn-add-emp");
      if (btnAddEmp) {
        btnAddEmp.onclick = async () => {
          const name = document.getElementById("new-emp-name").value.trim();
          if (!name) return;
          const rawPass = document.getElementById("new-emp-pass").value.trim();
          const pass = rawPass || name.toLowerCase();
          const rate = oneDecimalNumber(document.getElementById("new-emp-rate").value);
          const dailyHours = Math.max(0.5, Number(document.getElementById("new-emp-hours").value) || 4);
          const id = `emp_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;

          state.data.employees[id] = {
            id,
            name,
            password: pass,
            dailyHours,
            rateHistory: [{ effectiveDate: toDateStr(Date.now()), rate }],
            createdAt: Date.now()
          };
          if (!state.ownerChatEmpId) state.ownerChatEmpId = id;
          if (!state.ownerCalEmpId) state.ownerCalEmpId = id;
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      }

      document.querySelectorAll(".btn-save-rate").forEach((btn) => {
        btn.onclick = async () => {
          const empId = btn.dataset.saverate;
          const emp = state.data.employees[empId];
          if (!emp) return;
          const rate = oneDecimalNumber(document.getElementById(`rate-val-${empId}`).value);
          const effectiveDate = document.getElementById(`rate-date-${empId}`).value || toDateStr(Date.now());
          emp.rateHistory = Array.isArray(emp.rateHistory) ? emp.rateHistory : [];
          emp.rateHistory.push({ effectiveDate, rate });
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      });

      document.querySelectorAll(".btn-del-emp").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.dataset.delemp;
          delete state.data.employees[id];
          if (state.ownerChatEmpId === id) state.ownerChatEmpId = null;
          if (state.ownerCalEmpId === id) state.ownerCalEmpId = null;
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      });

      const btnMaster = document.getElementById("btn-change-master");
      if (btnMaster) {
        btnMaster.onclick = async () => {
          const val = document.getElementById("new-master-pass").value;
          if (!val) return;
          state.data.meta.masterPasswordHash = btoa(unescape(encodeURIComponent(val)));
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      }

      const btnToday = document.getElementById("btn-task-today");
      if (btnToday) {
        btnToday.onclick = () => {
          document.getElementById("task-date-input").value = toDateStr(Date.now());
        };
      }
      const btnAddTask = document.getElementById("btn-add-task");
      if (btnAddTask) {
        btnAddTask.onclick = async () => {
          const empId = document.getElementById("task-emp-select").value;
          const title = document.getElementById("task-title-input").value.trim();
          const date = document.getElementById("task-date-input").value || toDateStr(Date.now());
          if (!empId || !title) return;
          const taskId = `tsk_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;
          state.data.tasks[taskId] = { id: taskId, empId, date, title, done: false, createdAt: Date.now() };
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      }
      document.querySelectorAll(".btn-del-task").forEach((btn) => {
        btn.onclick = async () => {
          delete state.data.tasks[btn.dataset.deltask];
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      });

      document.querySelectorAll(".btn-select-chatemp").forEach((btn) => {
        btn.onclick = () => {
          state.ownerChatEmpId = btn.dataset.chatemp;
          stopChatAlarmFor(state.ownerChatEmpId);
          render();
        };
      });
      if (state.ownerSubTab === "chat" && state.ownerChatEmpId) {
        bindChatControls(state.ownerChatEmpId, "owner", getCurrentOwnerLabel());
      }
    }

    // =========================================================================
    // CALENDARIO Y PAGOS (SELECTOR MES CORTO NOV 2026 + ANCHO COMPLETO + 1 DEC)
    // =========================================================================
    function renderCalendarAndPaymentsSection(empId, monthKey, isOwnerView, showClosureAndShifts) {
      const activeMonthKey = monthKey || currentYearMonth();
      const [yStr, mStr] = activeMonthKey.split("-");
      const year = Number(yStr);
      const monthIdx = Number(mStr) - 1;
      const normalizedMonthKey = `${year}-${pad2(monthIdx + 1)}`;

      const firstDay = new Date(year, monthIdx, 1);
      const lastDay = new Date(year, monthIdx + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startOffset = (firstDay.getDay() + 6) % 7;

      const summary = getMonthSummary(empId, normalizedMonthKey);
      const monthOptions = getMonthOptions(normalizedMonthKey);
      const emp = state.data.employees[empId];

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div class="h-12 rounded-2xl bg-slate-100/60"></div>`);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${normalizedMonthKey}-${pad2(day)}`;
        const info = getDayStatusSummary(empId, dateStr);
        let bgClass = "bg-white text-slate-800 border-slate-200";
        if (info.state === "confirmed") {
          bgClass = "bg-emerald-100/90 text-emerald-950 border-emerald-300";
        } else if (info.state === "pending") {
          bgClass = "bg-amber-100/90 text-amber-950 border-amber-300";
        } else if (info.state === "open") {
          bgClass = "bg-sky-100/90 text-sky-950 border-sky-300";
        }

        const hm = info.totalMs > 0 ? msToHoursMinutes(info.totalMs) : null;
        cells.push(`
          <button data-caldate="${dateStr}" type="button" class="cal-day-btn h-12 rounded-2xl border ${bgClass} flex flex-col items-center justify-center leading-tight">
            <span class="text-xs font-extrabold">${day}</span>
            ${hm ? `<span class="text-[10px] font-bold opacity-90">${hm.hours}h ${pad2(hm.minutes)}m</span>` : ""}
          </button>
        `);
      }

      const monthShifts = Object.values(state.data.shifts || {})
        .filter((s) => s.empId === empId && s.date.startsWith(normalizedMonthKey))
        .sort((a, b) => b.startTs - a.startTs);

      const closed = summary.closure;
      const defaultPaidVal = oneDecimalNumber(summary.confirmedAmount);

      return `
        <section class="hc-card rounded-3xl p-3.5 space-y-3">
          <div class="flex flex-wrap items-center gap-2 text-xs font-bold text-slate-700">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-sky-50 border border-sky-200">
              <i class="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block"></i> En curso
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200">
              <i class="w-2.5 h-2.5 rounded-full bg-amber-300 inline-block"></i> Pendiente
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200">
              <i class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></i> Confirmado
            </span>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-1 min-w-0">
              <button type="button" data-monthdelta="-1" class="cal-month-step px-3 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-xs font-extrabold text-slate-800 shrink-0">◀</button>
              <select class="${isOwnerView ? "owner-cal-month" : "emp-cal-month"} w-full min-w-0 flex-1 rounded-2xl bg-slate-50 border border-slate-300 px-3 py-2.5 text-sm text-slate-900 font-extrabold focus:outline-none focus:border-blue-500">
                ${monthOptions.map((mk) => `<option value="${mk}" ${mk === normalizedMonthKey ? "selected" : ""}>${formatShortMonthYear(mk)}</option>`).join("")}
              </select>
              <button type="button" data-monthdelta="1" class="cal-month-step px-3 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-xs font-extrabold text-slate-800 shrink-0">▶</button>
            </div>
            <div class="text-sm font-extrabold text-slate-900 shrink-0">${formatShortMonthYear(normalizedMonthKey)}</div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="rounded-2xl bg-white border border-slate-200 p-3">
              <div class="text-xs font-semibold text-slate-500">Días trabajados</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5">${summary.daysCount}</div>
            </div>
            <div class="rounded-2xl bg-white border border-slate-200 p-3">
              <div class="text-xs font-semibold text-slate-500">Horas confirmadas</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5">${msToHoursMinutes(summary.confirmedMs).text}</div>
            </div>
            <div class="rounded-2xl bg-white border border-slate-200 p-3">
              <div class="text-xs font-semibold text-slate-500">Pendiente conf.</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5">${msToHoursMinutes(summary.pendingMs).text}</div>
            </div>
            <div class="rounded-2xl bg-white border border-slate-200 p-3">
              <div class="text-xs font-semibold text-slate-500">Importe</div>
              <div class="text-xl font-extrabold text-emerald-700 mt-0.5">${formatOneDecimalEuro(summary.confirmedAmount)}</div>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1.5 text-center text-xs font-bold text-slate-500 pt-1">
            <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells.join("")}
          </div>
        </section>

        ${showClosureAndShifts ? `
          <section class="hc-card rounded-3xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <div class="text-base font-extrabold text-slate-900">Cierre y pago del mes</div>
              ${closed ? `<span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Cerrado (${closed.paidDate})</span>` : ""}
            </div>
            <div class="text-xs text-slate-600 font-medium">
              Total confirmado: <strong class="text-slate-900">${formatOneDecimalEuro(summary.confirmedAmount)}</strong> (${msToHoursMinutes(summary.confirmedMs).text}).
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-extrabold text-slate-800">Importe abonado (€)</label>
              <input id="closure-pay-amount" type="number" step="0.1" value="${closed ? oneDecimalNumber(closed.amountPaid) : defaultPaidVal}"
                class="w-full rounded-2xl bg-white border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:outline-none focus:border-emerald-600" />
            </div>

            <div class="space-y-1">
              <label class="block text-xs font-extrabold text-slate-800">Fecha de pago</label>
              <input id="closure-pay-date" type="date" value="${closed?.paidDate || toDateStr(Date.now())}"
                class="w-full rounded-2xl bg-white border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:outline-none focus:border-emerald-600" />
            </div>

            <button id="btn-save-month-closure" data-empid="${empId}" data-monthkey="${normalizedMonthKey}" type="button"
              class="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow-xs">
              Guardar y cerrar mes
            </button>
          </section>

          <section class="space-y-2.5">
            <div class="text-sm font-extrabold text-slate-900 px-1">Turnos del mes (editar o confirmar)</div>
            ${monthShifts.length === 0 ? `
              <div class="hc-card rounded-3xl p-4 text-xs text-slate-500">No hay turnos registrados en ${formatShortMonthYear(normalizedMonthKey)}.</div>
            ` : monthShifts.map((s) => {
              const dur = msToHoursMinutes(getShiftDurationMs(s));
              const rate = getRateForDate(emp, s.date);
              const shiftAmount = formatOneDecimalEuro((dur.totalMinutes / 60) * rate);
              const statusBadge =
                s.status === "confirmed"
                  ? "bg-emerald-100 text-emerald-800"
                  : s.status === "pending"
                  ? "bg-amber-100 text-amber-900"
                  : "bg-sky-100 text-sky-800";
              const statusLabel = s.status === "confirmed" ? "Confirmado" : s.status === "pending" ? "Pendiente" : "En curso";

              return `
                <div class="hc-card rounded-3xl p-4 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <div class="text-sm font-extrabold text-slate-900">
                      ${escapeHtml(s.date)} · ${formatTimeHM(s.startTs)}–${s.endTs ? formatTimeHM(s.endTs) : "en curso"}
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-extrabold ${statusBadge}">${statusLabel}</span>
                  </div>
                  <div class="text-xs text-slate-600 font-medium">
                    Duración: <strong class="text-slate-900">${dur.text}</strong> · Tarifa: <strong class="text-slate-900">${formatOneDecimalEuro(rate)}/h</strong> · Importe: <strong class="text-slate-900">${shiftAmount}</strong>
                  </div>
                  <div class="flex items-center gap-2 pt-1">
                    ${s.status !== "open" ? `
                      <button data-editshift="${s.id}" type="button" class="btn-edit-shift px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-300 text-xs font-bold text-slate-800">
                        ✎ Ajustar
                      </button>
                    ` : ""}
                    ${s.status === "pending" ? `
                      <button data-confirmshift="${s.id}" type="button" class="btn-confirm-shift px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">
                        Confirmar
                      </button>
                    ` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </section>
        ` : ""}
      `;
    }

    function bindCalendarAndPaymentsControls(empId, isOwnerView) {
      const monthInput = document.querySelector(isOwnerView ? ".owner-cal-month" : ".emp-cal-month");
      if (monthInput) {
        monthInput.onchange = () => {
          if (isOwnerView) state.ownerCalMonth = monthInput.value;
          else state.calMonth = monthInput.value;
          render();
        };
      }

      document.querySelectorAll(".cal-month-step").forEach((btn) => {
        btn.onclick = () => {
          const delta = Number(btn.dataset.monthdelta) || 0;
          const current = isOwnerView ? (state.ownerCalMonth || currentYearMonth()) : (state.calMonth || currentYearMonth());
          const next = shiftMonthKey(current, delta);
          if (isOwnerView) state.ownerCalMonth = next;
          else state.calMonth = next;
          render();
        };
      });

      const saveClosureBtn = document.getElementById("btn-save-month-closure");
      if (saveClosureBtn) {
        saveClosureBtn.onclick = async () => {
          const targetEmpId = saveClosureBtn.dataset.empid;
          const targetMonth = saveClosureBtn.dataset.monthkey;
          const amountPaid = oneDecimalNumber(document.getElementById("closure-pay-amount")?.value);
          const paidDate = document.getElementById("closure-pay-date")?.value || toDateStr(Date.now());
          state.data.closures[`${targetEmpId}_${targetMonth}`] = {
            empId: targetEmpId,
            monthKey: targetMonth,
            amountPaid,
            paidDate,
            closedAt: Date.now()
          };
          saveLocal(state.homeCode, state.data);
          render();
          await pushToFirebase(state.homeCode, state.data);
        };
      }

      document.querySelectorAll(".cal-day-btn").forEach((btn) => {
        btn.onclick = () => {
          const dateStr = btn.dataset.caldate;
          const dayShifts = Object.values(state.data.shifts || {}).filter(
            (s) => s.empId === empId && s.date === dateStr
          );
          if (dayShifts.length === 0) return;
          const rows = dayShifts.map((s) => {
            const dur = msToHoursMinutes(getShiftDurationMs(s));
            const byText = s.confirmedBy ? ` · Confirmado por ${s.confirmedBy}` : s.adjustedBy ? ` · Ajustado por ${s.adjustedBy}` : "";
            return `
              <div class="p-2.5 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                <div>
                  <div class="font-bold text-slate-900">${formatTimeHM(s.startTs)} – ${s.endTs ? formatTimeHM(s.endTs) : "En curso"} (${dur.text})</div>
                  <div class="text-[10px] text-slate-500 font-bold uppercase">${s.status}${escapeHtml(byText)}</div>
                </div>
                ${isOwnerView && s.status !== "open" ? `
                  <button onclick="closeModal(); openShiftEditorModal('${s.id}')" class="px-3 py-1.5 rounded-xl bg-sky-600 text-white text-xs font-extrabold">Ajustar</button>
                ` : ""}
              </div>
            `;
          }).join("");
          openModal(`
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm font-extrabold text-slate-900">Detalle ${dateStr}</div>
              <button onclick="closeModal()" class="text-slate-500 text-xs px-2 py-1">✕</button>
            </div>
            <div class="space-y-2">${rows}</div>
          `);
        };
      });
    }

    // =========================================================================
    // CHAT EN TIEMPO REAL SIN CORTES + ALERTA VISUAL Y SONORA
    // =========================================================================
    function renderChatView(empId, role, senderName) {
      const msgs = Object.values(state.data.chats?.[empId] || {}).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const blinking = Boolean(state.blinkingChat[empId]);

      return `
        <section class="hc-card rounded-3xl p-3 flex-1 flex flex-col justify-between gap-2 min-h-0 ${blinking ? "chat-alert-blink" : ""}">
          <div class="flex items-center justify-between border-b border-slate-200 pb-2 shrink-0">
            <span class="text-xs font-extrabold text-amber-800">Chat en tiempo real (${escapeHtml(senderName)})</span>
            <button id="btn-mute-sound" type="button" class="px-2.5 py-1 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700">
              ${state.soundMuted ? "🔇 Silenciado" : "🔊 Sonido ON"}
            </button>
          </div>

          <div id="chat-messages-box" class="flex-1 min-h-0 overflow-y-auto no-scrollbar space-y-2 py-1">
            ${msgs.length === 0 ? `
              <div class="text-center text-xs text-slate-400 py-8">Sin mensajes todavía. Escribe algo o ficha un turno.</div>
            ` : msgs.map((m) => {
              const isMine = m.senderRole === role && m.senderName === senderName;
              const isSystem = m.kind === "system";
              const cleanSender = m.senderName && m.senderName !== "Sistema" ? m.senderName : (m.senderRole === "employee" ? "Empleada" : "Propietario");
              return `
                <div class="flex flex-col ${isMine ? "items-end" : "items-start"}">
                  <div class="max-w-[88%] rounded-2xl px-3.5 py-2 text-xs leading-relaxed ${
                    isSystem
                      ? "bg-amber-100 border border-amber-300 text-amber-950 font-medium"
                      : isMine
                      ? "bg-sky-600 text-white font-semibold"
                      : "bg-slate-100 border border-slate-200 text-slate-900"
                  }">
                    <div class="text-[10px] opacity-75 font-bold mb-0.5">${escapeHtml(cleanSender)} · ${formatTimeHM(m.ts)}</div>
                    <div class="break-words">${escapeHtml(m.text)}</div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-200 shrink-0">
            <input id="chat-input-field" type="text" placeholder="Escribe un mensaje..."
              class="flex-1 min-w-0 rounded-2xl bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500" />
            <button id="btn-send-chat" type="button" class="px-4 py-2.5 rounded-2xl bg-amber-500 text-slate-950 text-xs font-extrabold shrink-0">
              Enviar
            </button>
          </div>
        </section>
      `;
    }

    function bindChatControls(empId, role, senderName) {
      stopChatAlarmFor(empId);
      const box = document.getElementById("chat-messages-box");
      if (box) {
        requestAnimationFrame(() => {
          box.scrollTop = box.scrollHeight;
        });
        setTimeout(() => {
          box.scrollTop = box.scrollHeight;
        }, 60);
      }

      const muteBtn = document.getElementById("btn-mute-sound");
      if (muteBtn) {
        muteBtn.onclick = () => {
          state.soundMuted = !state.soundMuted;
          localStorage.setItem("hc_sound_muted", state.soundMuted ? "1" : "0");
          if (state.soundMuted) stopChatAlarmFor(empId);
          render();
        };
      }

      const sendBtn = document.getElementById("btn-send-chat");
      const inputField = document.getElementById("chat-input-field");
      if (sendBtn && inputField) {
        const sendAction = async () => {
          const txt = inputField.value.trim();
          if (!txt) return;
          inputField.value = "";
          await appendChatMessage(empId, role, senderName, txt, "user");
        };
        sendBtn.onclick = sendAction;
        inputField.onkeydown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            sendAction();
          }
        };
      }
    }

    // =========================================================================
    // TICKER DE CRONÓMETRO EN TIEMPO REAL
    // =========================================================================
    function startClockTicker() {
      if (state.clockTimer) clearInterval(state.clockTimer);
      state.clockTimer = setInterval(() => {
        if (state.role !== "employee" || state.empTab !== "work" || !state.activeEmpId) return;
        const emp = state.data.employees[state.activeEmpId];
        const openShift = getOpenShift(state.activeEmpId);
        const timerEl = document.getElementById("emp-live-timer");
        if (!timerEl || !emp) return;
        if (openShift) {
          timerEl.textContent = msToHoursMinutes(Date.now() - openShift.startTs).text;
        } else {
          const sum = getDayStatusSummary(emp.id, toDateStr(Date.now()));
          timerEl.textContent = msToHoursMinutes(sum.totalMs).text;
        }
      }, 1000);
    }

    // Arranque inicial
    if (state.homeCode) {
      const local = loadLocal(state.homeCode);
      if (local) state.data = sanitizeRemoteData(local);
      pullFromFirebase(state.homeCode, false).then(() => render());
    } else {
      render();
    }
  </script>
</body>
</html>
